[project]
name = "stock-school"
version = "0.1.0"
description = "台股教學靜態網站 — MkDocs 課程"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-mermaid2-plugin>=1.1",
]

[project.scripts]
stock-school-gen = "stock_school.cli:main"
stock-school-links = "stock_school.links.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8",
    "ruff>=0.9",
    "types-Markdown>=3.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["scripts", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# SVG 字串模板常超過行寬；忽略 E501 以免干擾可讀的繪圖程式
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "scripts"
packages = ["stock_school"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
