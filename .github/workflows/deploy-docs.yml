name: deploy-docs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Install dependencies
        run: uv sync

      - name: Lint and type-check
        run: |
          uv run ruff check scripts tests
          uv run mypy

      - name: Verify offline SVG generators are deterministic
        run: |
          uv run python -m stock_school.cli --only candles
          uv run python -m stock_school.cli --only cases
          uv run python -m stock_school.cli --only concepts
          git diff --exit-code docs/assets/

      - name: Run chart/asset tests
        run: uv run pytest tests/ -v

      - name: Audit links and anchors
        run: uv run stock-school-links --strict

      - name: Validate docs (strict build)
        run: uv run mkdocs build --strict

  deploy:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Install dependencies
        run: uv sync

      - name: Build and deploy to gh-pages
        run: uv run mkdocs gh-deploy --force
